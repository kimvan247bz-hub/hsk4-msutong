<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>速通汉语 中级1 — HSK4 Msutong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700&family=Zilla+Slab:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Bảng màu lấy theo bìa giáo trình 速通汉语 Msutong — xanh ngọc lục bảo + be trang nhã */
    --moss-900:#0a3d34; --moss-800:#0e5c4d; --moss-700:#128a71; --moss-600:#1aa084;
    --moss-500:#2bb896; --moss-300:#a8e2cd; --moss-200:#d6f0e4; --moss-100:#eef8f3;
    --cream:#f6efdf; --paper:#fffcf3; --ink:#2c2a22; --gold:#c9962f;
    --accent-2:#d9723c; --accent-3:#2f7f92; --accent-4:#c69a2e; --accent-5:#b8586b; --accent-6:#1f6b4a;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:'Noto Sans SC',sans-serif; }
  header{
    background:linear-gradient(135deg,var(--moss-800),var(--moss-600)); color:#fff;
    padding:40px 20px; text-align:center;
  }
  header h1{ font-family:'Noto Serif SC',serif; margin:0 0 8px; font-size:2rem; }
  header p{ margin:0; opacity:.9; font-family:'Zilla Slab',serif; font-style:italic; }
  main{ max-width:960px; margin:0 auto; padding:32px 18px 60px; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
  .lesson-card{
    display:block; background:var(--paper); border:1px solid var(--moss-200); border-radius:16px;
    padding:22px 20px; text-decoration:none; color:var(--ink); box-shadow:0 1px 4px rgba(60,77,49,.08);
    transition:transform .15s, box-shadow .15s; position:relative; min-height:120px;
  }
  .lesson-card.unlocked:hover{ transform:translateY(-3px); box-shadow:0 6px 16px rgba(60,77,49,.18); }
  .lesson-card.locked{ opacity:.55; cursor:not-allowed; }
  .lesson-num{ font-family:'Noto Serif SC',serif; font-weight:900; font-size:1.3rem; color:var(--moss-700); }
  .lesson-title{ font-family:'Noto Serif SC',serif; font-size:1.05rem; margin:6px 0 10px; color:var(--moss-900); }
  .lesson-status{ font-size:.8rem; color:var(--gold); font-weight:700; }
  .lesson-status.ok{ color:var(--moss-600); }
  footer{ text-align:center; font-size:.8rem; color:#8a8578; padding:24px; }
</style>
</head>
<body>

<header>
  <h1>速通汉语 · 中级1</h1>
  <p>Msutong HSK4 — Giáo trình trung cấp</p>
</header>

<main>
  <div class="grid">
    <a class="lesson-card unlocked" href="bai1.html">
      <div class="lesson-num">第一课</div>
      <div class="lesson-title">来几个家常菜吧</div>
      <div class="lesson-status ok">✓ Đã cập nhật</div>
    </a>
    <a class="lesson-card unlocked" href="bai2.html">
      <div class="lesson-num">第二课</div>
      <div class="lesson-title">说曹操，曹操到</div>
      <div class="lesson-status ok">✓ Đã cập nhật</div>
    </a>
    <div class="lesson-card locked">
      <div class="lesson-num">第三课</div>
      <div class="lesson-title">Bài 3 — sắp cập nhật</div>
      <div class="lesson-status">🔒 Sắp cập nhật</div>
    </div>
  </div>
</main>

<footer>速通汉语 中级1 · Tài liệu học tập nội bộ</footer>

</body>
</html>
